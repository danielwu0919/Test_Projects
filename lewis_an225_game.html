<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lewis's An-225 Adventure!</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(circle at 50% 35%, #1c2b47, #080c16);
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; overflow: hidden;
         user-select: none; -webkit-user-select: none; }
  canvas { width: min(96vw, calc((100vh - 64px) * 16 / 9)); aspect-ratio: 16 / 9;
           border: 3px solid #FFD700; border-radius: 10px; display: block;
           box-shadow: 0 10px 40px rgba(0,0,0,.6); touch-action: none; }
  p { color: #9fb0c8; margin: 10px 0 0; font-size: 13px; text-align: center; }
  b { color: #FFD700; font-weight: normal; }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<p><b>SPACE / ↑ / hold screen</b> = climb &nbsp;|&nbsp; <b>↓</b> = dive &nbsp;|&nbsp;
   <b>P</b> = pause &nbsp;|&nbsp; <b>R</b> = restart</p>

<!-- 3D sprite list, generated from the Blender models; the game falls back to drawn art without it -->
<script src="assets/sprites/sprites.js"></script>
<script>
'use strict';

// ── constants ──────────────────────────────────────────────────────────────
const W = 800, H = 450;
const GROUND = H - 44;          // y of the grass line
const PLANE_X = 190;            // screen x of the plane's centre
const RUNWAY_Y = GROUND + 12;   // where the wheels meet the grass
const GEAR_TRAVEL = 12;         // how far the gear sprite slides up into the belly when retracted
const PLANE_SCALE = 1.2;        // the 3D An-225 is drawn a little larger than it was modelled
const HARD_LANDING = 3;         // touchdown sink rate (px/tick) that damages the hull
const STEP = 1000 / 60;         // fixed physics step (ms) — same speed on any monitor
const LEVEL_TICKS = 1200;       // 20 s per level
const MAX_HP = 3, MAX_COMBO = 5;
const TAU = Math.PI * 2;
const FONT = "'Trebuchet MS','Segoe UI',Arial,sans-serif";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let viewScale = 1;

// ── helpers ────────────────────────────────────────────────────────────────
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const hash  = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css  = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

// Every scenery / object colour goes through C() so the whole world is lit by
// the current time of day (white at noon, orange at sunset, deep blue at night).
let amb = [1, 1, 1], ambKey = '1,1,1';
const tintCache = new Map();
function tint3(c) { return [c[0] * amb[0], c[1] * amb[1], c[2] * amb[2]]; }
function C(hex) {
  let v = tintCache.get(hex);
  if (!v) { v = css(tint3(hexRgb(hex))); tintCache.set(hex, v); }
  return v;
}
function setAmbient(rgb) {
  const q = rgb.map(v => Math.round(v / 255 * 40) / 40);
  if (q[0] !== amb[0] || q[1] !== amb[1] || q[2] !== amb[2]) { amb = q; ambKey = q.join(); tintCache.clear(); }
}

// ── time of day: one phase per level, cycling day → night → day ─────────────
const SKY = [
  { name: 'Blue Skies',       top: '#2a7fd6', bot: '#a9dcf7', amb: [255, 255, 255], sun: [640,  78], stars: 0 },
  { name: 'Golden Afternoon', top: '#3b7cc9', bot: '#f6dfae', amb: [255, 242, 216], sun: [655, 175], stars: 0 },
  { name: 'Sunset',           top: '#3a3f8a', bot: '#ff9b5e', amb: [255, 188, 150], sun: [668, 268], stars: 0.15 },
  { name: 'Dusk',             top: '#161c4a', bot: '#93507f', amb: [150, 135, 188], sun: [680, 440], stars: 0.7 },
  { name: 'Starry Night',     top: '#050a1f', bot: '#1a2b5a', amb: [ 98, 112, 168], sun: [690, 540], stars: 1 },
  { name: 'Sunrise',          top: '#3d4f96', bot: '#ffb59a', amb: [255, 205, 190], sun: [612, 280], stars: 0.2 },
].map(s => ({ ...s, top: hexRgb(s.top), bot: hexRgb(s.bot) }));

const STARS = Array.from({ length: 90 }, (_, i) => ({
  x: hash(i) * W, y: hash(i + 0.37) * (GROUND - 120), s: 0.8 + hash(i + 0.71) * 1.5, p: hash(i + 0.13) * TAU,
}));

function environment() {
  const t = state === 'start' ? 0 : ticks / LEVEL_TICKS;
  const i = Math.floor(t) % SKY.length;
  const f = smooth(clamp(((t % 1) - 0.6) / 0.4, 0, 1));      // blend into the next phase late in the level
  const a = SKY[i], b = SKY[(i + 1) % SKY.length];
  return {
    top: mix3(a.top, b.top, f), bot: mix3(a.bot, b.bot, f), amb: mix3(a.amb, b.amb, f),
    sun: [lerp(a.sun[0], b.sun[0], f), lerp(a.sun[1], b.sun[1], f)],
    stars: lerp(a.stars, b.stars, f),
  };
}

// ── state ──────────────────────────────────────────────────────────────────
let state = 'start';            // start | playing | paused | crashing | gameover
let clock = 0;                  // animation ticks (never resets)
let ticks = 0;                  // ticks of actual play this run
let worldX = 0, speed = 2.2;
let score = 0, scoreF = 0, dist = 0, level = 1, hp = MAX_HP, combo = 1, crates = 0;
let best = 0, newBest = false, overT = 0;
let obstacles = [], pickups = [], particles = [], popups = [], clouds = [];
let spawnT = 0, crateT = 0, powerT = 0, lastY = H / 2;
let shake = 0, flash = 0, banner = null;
let tips = {};                  // how many of each kind of thing have appeared this flight
const plane = { y: 300, vy: 0, pitch: 0, gear: 1, invuln: 0, shield: 0, magnet: 0,
                onGround: true, susp: 0, suspV: 0, airT: 0 };
const input = { up: false, down: false };

try { best = parseInt(localStorage.getItem('lewis_an225_best'), 10) || 0; } catch (e) { best = 0; }

function initClouds() {
  clouds = Array.from({ length: 9 }, () => ({
    x: rand(-60, W + 60), y: rand(26, 215), s: rand(0.45, 1.25), d: rand(0.15, 0.7), v: randi(0, 2),
  })).sort((a, b) => a.d - b.d);
}

function startGame() {
  state = 'playing';
  ticks = 0; score = 0; scoreF = 0; dist = 0; level = 1; hp = MAX_HP; combo = 1; crates = 0;
  speed = Math.max(speed, 0.6); newBest = false; overT = 0;         // accelerate from wherever we were rolling
  obstacles = []; pickups = []; popups = []; tips = {};
  spawnT = 170; crateT = 200; powerT = 620; lastY = H / 2;
  shake = 0; flash = 0;
  // every flight starts with a take-off roll
  Object.assign(plane, { vy: 0, pitch: 0, gear: 1, invuln: 120, shield: 0, magnet: 0,
                         onGround: true, susp: 0, suspV: 0, airT: 0 });
  plane.y = floorY();
  banner = { title: 'Level 1', sub: SKY[0].name, t: 150 };
}

function endGame() {
  state = 'gameover'; overT = 0; speed = 0;
  newBest = score > best;
  if (newBest) {
    best = score;
    try { localStorage.setItem('lewis_an225_best', String(best)); } catch (e) { /* private mode */ }
  }
}

function togglePause() {
  if (state === 'playing') state = 'paused';
  else if (state === 'paused') state = 'playing';
}

// ── input ──────────────────────────────────────────────────────────────────
const UP_KEYS = ['Space', 'ArrowUp', 'KeyW'], DOWN_KEYS = ['ArrowDown', 'KeyS'];

function pressUp() {
  if (state === 'start') startGame();
  else if (state === 'gameover') { if (overT > 45) startGame(); }
  else if (state === 'paused') togglePause();
  else if (state === 'playing') {
    if (plane.onGround) plane.pitch -= 0.03;              // on the runway a tap just nudges the nose up
    else if (plane.vy > -2.2) plane.vy -= 1.2;            // in the air a tap gives a little hop
  }
}

document.addEventListener('keydown', e => {
  const k = e.code;
  if (UP_KEYS.includes(k)) { e.preventDefault(); if (!e.repeat) pressUp(); input.up = true; }
  else if (DOWN_KEYS.includes(k)) { e.preventDefault(); input.down = true; }
  else if (k === 'KeyP' || k === 'Escape') togglePause();
  else if (k === 'KeyR' || k === 'Enter') {
    if (state === 'gameover' || (state === 'start' && k === 'Enter')) startGame();
  }
});
document.addEventListener('keyup', e => {
  if (UP_KEYS.includes(e.code)) input.up = false;
  if (DOWN_KEYS.includes(e.code)) input.down = false;
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); pressUp(); input.up = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n =>
  canvas.addEventListener(n, () => { input.up = false; }));
window.addEventListener('blur', () => {
  input.up = input.down = false;
  if (state === 'playing') state = 'paused';
});

// ── plane geometry (local coords: origin = fuselage centre, nose towards +x) ─
const NEAR_WING = [[40, -9], [-34, 30], [-52, 30], [-8, -9]];
const FAR_WING  = [[44, -13], [-14, -46], [-30, -46], [2, -13]];
const NEAR_ENG = [0.26, 0.5, 0.74].map(t => [lerp(40, -34, t) + 5, lerp(-9, 30, t) + 5]);
const FAR_ENG  = [0.3, 0.55, 0.8].map(t => [lerp(44, -14, t) + 4, lerp(-13, -46, t) + 4]);

// Numbers the physics needs from the plane's shape.  These match the hand-drawn fallback plane;
// once the 3D sprites load they are replaced by the points exported from the Blender model.
let GEOM = {
  caps: [[[-96, -2], [94, 1], 12], [[30, -4], [-38, 26], 7]],     // fuselage and near wing: [a, b, radius]
  wheels: { rear: -30, front: 20, nose: 74, drop: 38 },           // wheel x positions, and depth below centre
  exhaust: NEAR_ENG.map(([x, y]) => [x - 18, y]).concat(FAR_ENG.map(([x, y]) => [x - 15, y])),
  lights: { wing: [-43, 30], tail: [-114, -19], top: [8, -16] },
};

// How far below the plane's centre its lowest wheel is at a given pitch: nose-up puts the
// rear main wheels lowest, nose-down the nose wheel.
function gearReach(pitch) {
  const s = Math.sin(pitch), w = GEOM.wheels;
  return Math.max(w.rear * s, w.front * s, w.nose * s) + w.drop * Math.cos(pitch);
}
const floorY = () => RUNWAY_Y - gearReach(plane.pitch);    // plane.y when the wheels are on the grass

function planeToWorld(lx, ly) {
  const c = Math.cos(plane.pitch), s = Math.sin(plane.pitch);
  return [PLANE_X + lx * c - ly * s, plane.y + lx * s + ly * c];
}

// Collision shape: two capsules (fuselage + near wing) that rotate with the plane.
function planeCapsules() {
  return GEOM.caps.map(([a, b, r]) => ({ a: planeToWorld(...a), b: planeToWorld(...b), r }));
}

function distToSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(px - (a[0] + dx * t), py - (a[1] + dy * t));
}

// Hit circles for each obstacle type, as [dx, dy, radius] (a touch smaller than the art).
const SHAPES = {
  bird:    [[-2, -1, 9]],
  balloon: [[0, -13, 25], [0, 31, 7]],
  storm:   [[-24, 4, 17], [0, -2, 22], [24, 4, 17]],
  jet:     [[-18, 0, 7], [0, 1, 8], [18, -3, 8]],
};

function gapTo(o, caps) {
  let g = 1e9;
  for (const [dx, dy, r] of SHAPES[o.kind])
    for (const c of caps) g = Math.min(g, distToSeg(o.x + dx, o.y + dy, c.a, c.b) - r - c.r);
  return g;
}

const stormStriking = o => o.t % 150 >= 120;
const stormCharging = o => o.t % 150 >= 90 && o.t % 150 < 120;

function lightningHits(o, caps) {
  for (const c of caps)
    for (let i = 0; i <= 6; i++) {
      const px = lerp(c.a[0], c.b[0], i / 6), py = lerp(c.a[1], c.b[1], i / 6);
      if (Math.abs(px - o.x) < 8 + c.r * 0.6 && py > o.y + 14) return true;
    }
  return false;
}

// ── spawning ───────────────────────────────────────────────────────────────
function pickY(min, max, sep = 85) {
  let y = rand(min, max);
  if (Math.random() < 0.3) y = clamp(plane.y + rand(-35, 35), min, max);    // sometimes aim at the plane
  else for (let i = 0; i < 6 && Math.abs(y - lastY) < sep; i++) y = rand(min, max);
  lastY = y;
  return y;
}

// The first two times each kind of thing appears in a flight it carries a "CATCH!" or "DODGE!"
// label, so a new pilot learns what is what.
function wantTip(kind) {
  tips[kind] = (tips[kind] || 0) + 1;
  return tips[kind] <= 2;
}

function newObstacle(kind, props) {
  obstacles.push({ kind, x: W + 40, y: 0, vx: 0, t: 0, minGap: 1e9, seed: rand(0, 100),
                   phase: rand(0, TAU), ...props, tip: props.tip !== false && wantTip(kind) });
}

function spawnObstacle() {
  const r = Math.random();
  if (level >= 4 && r < 0.13) {
    newObstacle('jet', { x: W + 380, y: pickY(70, GROUND - 80), vx: 4.5 });
  } else if (level >= 3 && r < 0.33) {
    newObstacle('storm', { x: W + 70, y: pickY(135, 235, 40), t: randi(0, 70) });
  } else if (level >= 2 && r < 0.52) {
    newObstacle('balloon', { y: pickY(95, GROUND - 90), vy: rand(0.2, 0.45) * (Math.random() < 0.5 ? -1 : 1),
                             col: randi(0, 2) });
  } else if (level >= 2 && r < 0.72) {
    const y = pickY(95, GROUND - 85), phase = rand(0, TAU), vx = rand(0.8, 1.4);
    const rows = level >= 5 ? 2 : 1;                     // V formation: 3 birds, later 5
    newObstacle('bird', { y, baseY: y, amp: 8, phase, vx });
    for (let k = 1; k <= rows; k++)
      for (const side of [-1, 1])
        newObstacle('bird', { x: W + 40 + 26 * k, y: y + side * 18 * k, baseY: y + side * 18 * k,
                              amp: 8, phase, vx, tip: false });
  } else {
    const y = pickY(60, GROUND - 20);                     // single birds can skim the ground too
    newObstacle('bird', { y, baseY: y, amp: rand(6, 18), vx: rand(0.8, 1.6) });
  }
}

function newPickup(kind, x, y, tip = true) {
  pickups.push({ kind, x, y, baseY: y, t: 0, phase: rand(0, TAU), tip: tip && wantTip(kind) });
}

function spawnCrates() {
  const y = rand(70, GROUND - 75);
  const n = Math.random() < 0.25 ? 3 : 1;                // sometimes a row of three
  for (let i = 0; i < n; i++) newPickup('crate', W + 30 + i * 70, y, i === 0);
}

function spawnPower() {
  const kinds = ['shield', 'magnet'];
  if (hp < MAX_HP) kinds.push('heart', 'heart');         // repair kits only when they're useful
  newPickup(kinds[randi(0, kinds.length - 1)], W + 30, rand(80, GROUND - 90));
}

// ── effects ────────────────────────────────────────────────────────────────
function emit(p) { if (particles.length < 600) particles.push({ max: p.life, ...p }); }
function popup(text, x, y, col = '#FFD700', size = 16) {
  popups.push({ text, x, y, col, size, life: 62, max: 62 });
}

function sparkle(x, y, col, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(1, 4.2);
    emit({ x, y, vx: Math.cos(a) * v - speed * 0.4, vy: Math.sin(a) * v, g: 0.05, drag: 0.95,
           life: randi(18, 34), r: rand(1.4, 3), col, front: true, glow: true });
  }
}

function feathers(x, y) {
  for (let i = 0; i < 9; i++)
    emit({ x, y, vx: rand(-2.5, 1.5) - speed * 0.4, vy: rand(-2.5, 1), g: 0.06, drag: 0.96,
           life: randi(30, 55), r: rand(2, 3.6), col: '#e9edf3', tint: true, front: true,
           feather: true, rot: rand(0, TAU), spin: rand(-0.25, 0.25) });
}

function dust(x, y, n, power = 1) {
  for (let i = 0; i < n; i++)
    emit({ x: x + rand(-40, 40), y: y + rand(-3, 2), vx: -speed * 0.7 + rand(-1.2, 0.6),
           vy: rand(-1.8, -0.2) * power, g: 0.03, drag: 0.97, life: randi(24, 46),
           r: rand(3, 7), grow: 0.25, col: '#cdbb93', a: 0.5, tint: true, front: true });
}

function emitExhaust() {
  if (clock % 2) return;
  const hurt = state === 'crashing' || state === 'gameover';
  GEOM.exhaust.forEach(([ex, ey], i) => {
    const far = i >= 3;
    const [x, y] = planeToWorld(ex, ey);
    if (!hurt)
      emit({ x, y, vx: -speed * 0.55 - 1.2, vy: rand(-0.12, 0.12), life: 26, r: far ? 1.6 : 2.2,
             grow: 0.2, col: '#ffffff', a: far ? 0.16 : 0.3, tint: true });
  });
  // a struggling engine smokes when the hull is nearly gone
  if ((hp === 1 && state === 'playing' && clock % 4 === 0) || (hurt && clock % 4 === 0)) {
    const [x, y] = planeToWorld(GEOM.exhaust[1][0] + 4, GEOM.exhaust[1][1]);
    emit({ x, y, vx: -speed * 0.6 - 0.5, vy: rand(-0.9, -0.3), life: 46, r: 3.5, grow: 0.3,
           col: '#3a3d44', a: 0.55, tint: true, front: true });
  }
}

// ── game logic ─────────────────────────────────────────────────────────────
function hitPlane(o, why) {
  if (plane.invuln > 0 || state !== 'playing') return;
  if (o && o.kind === 'bird') { o.scared = true; feathers(o.x, o.y); }
  if (o && o.kind === 'balloon') o.vy = (o.y < plane.y ? -1 : 1) * 1.3;

  if (plane.shield > 0) {                                 // the shield soaks up one hit
    plane.shield = 0; plane.invuln = 60; shake = 5;
    sparkle(PLANE_X + 40, plane.y, '#8fd8ff', 22);
    popup('Shield saved you!', PLANE_X, plane.y - 46, '#8fd8ff');
    return;
  }
  hp--; combo = 1; plane.invuln = 120; shake = 11; flash = Math.max(flash, 0.25);
  if (o) plane.vy += plane.y < o.y ? -2.6 : 2.6;          // knocked away from whatever we hit
  sparkle(o ? (o.x + PLANE_X) / 2 : PLANE_X, o ? (o.y + plane.y) / 2 : plane.y + 30, '#ffcf5a', 14);
  popup(why || 'Ouch!', PLANE_X, plane.y - 46, '#ff8a8a');
  if (hp <= 0) { state = 'crashing'; plane.shield = plane.magnet = 0; }
}

// ── flight physics ─────────────────────────────────────────────────────────
// In the air: thrust, gravity and drag, an air cushion close to the ground, and a flare
// that brings the nose up before the wheels touch.
function fly() {
  const alt = floorY() - plane.y;
  // A heavy aeroplane: it gathers vertical speed slowly and never gets much of it.  Held
  // inputs settle at about 3.6 px/tick up, 2.5 down hands-off and 5 in a dive.
  let ay = 0.12;                                          // gravity
  if (input.up) ay -= 0.29;                               // lift while climbing
  if (input.down) ay += 0.12;                             // nose-down dive
  if (alt < 50) ay -= 0.05 * (1 - Math.max(alt, 0) / 50); // ground effect
  if (plane.y < 52) ay += (52 - plane.y) * 0.02;          // thin air: soft ceiling
  plane.vy = clamp((plane.vy + ay) * 0.955, -4.2, 5.6);   // drag gives the big plane its weight
  plane.y += plane.vy;
  if (plane.y < 34) { plane.y = 34; plane.vy = Math.max(plane.vy, 0); }

  let want = clamp(Math.atan2(plane.vy, 10), -0.45, 0.4);
  want = lerp(want, Math.min(want, -0.05), clamp(1 - alt / 70, 0, 1));      // flare
  plane.pitch += (want - plane.pitch) * 0.1;
  plane.gear = clamp(plane.gear + (alt < 110 ? 0.06 : -0.04), 0, 1);
  plane.airT++;

  const fy = floorY();
  if (plane.y >= fy) {
    plane.y = fy;
    if (plane.vy >= 0) touchDown();
  }
}

// The wheels have met the grass.  A gentle arrival settles onto the gear, a firm one skips
// once, and a hard one bounces and costs a heart.  Each bounce loses most of its energy,
// so the plane always ends up rolling instead of hopping forever.
function touchDown() {
  const v = plane.vy, wx = PLANE_X + (GEOM.wheels.rear + GEOM.wheels.front) / 2;
  plane.suspV += Math.min(v, 5) * 0.8;                    // the landing gear soaks up the hit
  if (v > HARD_LANDING) {
    plane.vy = -v * 0.38;
    dust(wx, RUNWAY_Y, 16, 1.5);
    hitPlane(null, 'Hard landing!');
  } else if (v > 1.7) {
    plane.vy = -v * 0.25;
    dust(wx, RUNWAY_Y, 7);
  } else {
    plane.onGround = true; plane.vy = 0;
    dust(wx, RUNWAY_Y, 4, 0.6);
    if (plane.airT > 90) popup('Smooth landing!', PLANE_X, plane.y - 46, '#d9f7c9', 13);
  }
}

// Rolling on the gear: the wheels stay planted and nothing bounces.  Holding climb raises
// the nose about the main wheels (faster with more speed); once rotated, the plane lifts off.
function groundRoll() {
  plane.vy = 0; plane.airT = 0;
  plane.gear = Math.min(1, plane.gear + 0.06);
  const rate = input.up ? 0.055 * clamp(speed / 4, 0.4, 1) : 0.07;
  plane.pitch += ((input.up ? -0.17 : 0) - plane.pitch) * rate;
  plane.y = floorY();
  if (input.up && plane.pitch < -0.09) { plane.onGround = false; plane.vy = -1; }
}

function updatePlay() {
  ticks++;
  const lv = 1 + Math.floor(ticks / LEVEL_TICKS);
  if (lv !== level) {
    level = lv;
    banner = { title: 'Level ' + level, sub: SKY[(level - 1) % SKY.length].name, t: 150 };
  }
  speed += (Math.min(3.5 + (level - 1) * 0.38, 7.5) - speed) * (speed < 3.6 ? 0.02 : 0.01);   // brisk take-off roll
  if (!plane.onGround) {                                  // distance and score only count while flying
    dist += speed;
    scoreF += speed / 4;
    score += Math.floor(scoreF); scoreF -= Math.floor(scoreF);
  }

  if (plane.onGround) groundRoll(); else fly();
  if (plane.invuln > 0) plane.invuln--;
  if (plane.shield > 0) plane.shield--;
  if (plane.magnet > 0) plane.magnet--;

  // ── spawning ──
  if (--spawnT <= 0) { spawnObstacle(); spawnT = Math.max(56, 130 - level * 9) * rand(0.8, 1.25); }
  if (--crateT <= 0) { spawnCrates(); crateT = rand(140, 230); }
  if (--powerT <= 0) { spawnPower(); powerT = rand(700, 1000); }

  // ── collisions ──
  const caps = planeCapsules();
  for (const o of obstacles) {
    if (!o.passed && o.x < PLANE_X - 135) {               // it got past us: was it a near miss?
      o.passed = true;
      if (!o.touched && !o.scared && o.kind !== 'storm' && o.minGap < 13) {
        score += 25; popup('Close call! +25', PLANE_X + 20, plane.y - 40, '#ffffff', 13);
      }
    }
    if (o.scared || Math.abs(o.x - PLANE_X) > 210) continue;
    const gap = gapTo(o, caps);
    o.minGap = Math.min(o.minGap, gap);
    if (gap < 0) { o.touched = true; hitPlane(o); }
    if (o.kind === 'storm') {
      if (Math.abs(o.x - PLANE_X) < 130 && !plane.onGround) plane.vy += rand(-0.12, 0.12);   // turbulence
      if (stormStriking(o) && lightningHits(o, caps)) { o.touched = true; hitPlane(o, 'Zap!'); }
    }
    if (state !== 'playing') return;
  }

  // ── pickups ──
  pickups = pickups.filter(p => {
    const d = Math.hypot(p.x - PLANE_X, p.y - plane.y);
    if (plane.magnet > 0 && d < 200) {                    // the magnet reels things in
      p.x += (PLANE_X - p.x) * 0.09; p.baseY += (plane.y - p.baseY) * 0.09;
    }
    let g = 1e9;
    for (const c of caps) g = Math.min(g, distToSeg(p.x, p.y, c.a, c.b) - c.r);
    if (g < 17) { collect(p); return false; }
    if (p.x < -40) { if (p.kind === 'crate') combo = Math.max(1, combo - 1); return false; }
    return true;
  });
}

function collect(p) {
  if (p.kind === 'crate') {
    const pts = 50 * combo;
    score += pts; crates++;
    popup('+' + pts + (combo > 1 ? '  x' + combo : ''), p.x, p.y - 18, '#FFD700', 15 + combo);
    sparkle(p.x, p.y, '#ffe27a', 12);
    combo = Math.min(MAX_COMBO, combo + 1);
  } else if (p.kind === 'heart') {
    if (hp < MAX_HP) { hp++; popup('Repaired!', p.x, p.y - 18, '#ff9aa8'); }
    else { score += 100; popup('+100', p.x, p.y - 18, '#ff9aa8'); }
    sparkle(p.x, p.y, '#ff8fa0', 16);
  } else if (p.kind === 'shield') {
    plane.shield = 480; popup('Shield!', p.x, p.y - 18, '#8fd8ff'); sparkle(p.x, p.y, '#8fd8ff', 16);
  } else {
    plane.magnet = 480; popup('Cargo magnet!', p.x, p.y - 18, '#d3b0ff'); sparkle(p.x, p.y, '#d3b0ff', 16);
  }
}

// Out of hull points: glide down, flare, and roll out to a stop on the gear.
function updateCrash() {
  plane.gear = Math.min(1, plane.gear + 0.06);
  if (!plane.onGround) {
    const alt = floorY() - plane.y;
    plane.vy = Math.min(plane.vy + 0.2, alt < 60 ? 2.4 : 4.5);
    plane.y += plane.vy;
    plane.pitch += ((alt < 70 ? -0.06 : 0.14) - plane.pitch) * 0.06;
    if (plane.y >= floorY()) {
      plane.onGround = true; plane.suspV += plane.vy; plane.vy = 0; shake = 9;
      dust(PLANE_X, RUNWAY_Y, 22, 1.6);
    }
  } else {
    speed *= 0.966;
    plane.pitch += (0 - plane.pitch) * 0.07;
    if (speed > 0.6 && clock % 3 === 0) dust(PLANE_X - 20, RUNWAY_Y, 2);
    if (speed < 0.2) endGame();
  }
  if (plane.onGround) plane.y = floorY();
}

function updateWorld() {
  worldX += speed;
  for (const c of clouds) {
    c.x -= speed * c.d * 0.45 + 0.12;
    if (c.x < -130 * c.s) { c.x = W + 130 * c.s; c.y = rand(26, 215); }
  }

  for (const o of obstacles) {
    o.t++;
    o.x -= speed + o.vx;
    if (o.kind === 'bird') {
      if (o.scared) { o.y -= 3.2; o.x += 1.5; }
      else o.y = o.baseY + Math.sin(o.t * 0.07 + o.phase) * o.amp;
    } else if (o.kind === 'balloon') {
      o.y += o.vy;
      if (o.y < 85 || o.y > GROUND - 75) o.vy *= -1;
    } else if (o.kind === 'jet') {
      if (o.x < W + 40 && clock % 2 === 0)
        emit({ x: o.x + 30, y: o.y, vx: -speed * 0.3, vy: rand(-0.1, 0.1), life: 22, r: 2.4, grow: 0.25,
               col: '#ffffff', a: 0.35, tint: true });
    } else if (o.kind === 'storm' && o.t % 150 === 120 && o.x > -40 && o.x < W + 40) {
      flash = Math.max(flash, 0.4); shake = Math.max(shake, 3);
    }
  }
  obstacles = obstacles.filter(o => o.x > -140 && o.y > -60);

  for (const p of pickups) {
    p.t++;
    p.x -= speed * 0.85;
    p.y = p.baseY + Math.sin(p.t * 0.05 + p.phase) * 6;
  }
  if (state !== 'playing') pickups = pickups.filter(p => p.x > -40);

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.g) p.vy += p.g;
    if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
    if (p.grow) p.r += p.grow;
    if (p.spin) p.rot += p.spin;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 0.7; p.life--; }
  popups = popups.filter(p => p.life > 0);

  // landing-gear suspension: a damped spring, so touchdowns settle instead of ringing
  plane.suspV = (plane.suspV - plane.susp * 0.2) * 0.72;
  plane.susp = clamp(plane.susp + plane.suspV, -1.5, 6);
  shake *= 0.86; flash *= 0.84;
  if (banner && --banner.t <= 0) banner = null;
}

function tick() {
  if (state === 'paused') return;
  clock++;
  if (state === 'start') {
    speed = 2.2;                                          // taxiing, waiting for take-off
    plane.onGround = true; plane.gear = 1; plane.pitch = 0; plane.vy = 0;
    plane.y = floorY();
  } else if (state === 'playing') updatePlay();
  else if (state === 'crashing') updateCrash();
  else overT++;
  emitExhaust();
  updateWorld();
}

// ── 3D sprites ─────────────────────────────────────────────────────────────
// Rendered from the Blender models by assets/blender/build_assets.py.  If the sprite list or
// any image is missing, SPR.on stays false and everything is drawn with the vector art below.
const SPR = { on: false, meta: (window.AN225_SPRITES || {}).sprites, img: {}, lit: new Map() };

function spritesReady() {
  const K = PLANE_SCALE, p = {};                          // physics now follows the 3D model
  for (const [name, [x, y]] of Object.entries(SPR.meta.plane_body.points)) p[name] = [x * K, y * K];
  GEOM = {
    caps: [[p.fuse_a, p.fuse_b, 11 * K], [p.wing_a, p.wing_b, 5.5 * K]],
    wheels: { rear: p.wheel_rear[0], front: p.wheel_front[0], nose: p.wheel_nose[0], drop: p.wheel_rear[1] },
    exhaust: [0, 1, 2, 3, 4, 5].map(i => p['exhaust_' + i]),
    lights: { wing: p.light_wing, tail: p.light_tail, top: p.light_top },
  };
  SPR.on = true;
}

(function loadSprites() {
  if (!SPR.meta) return;
  const names = Object.keys(SPR.meta);
  let left = names.length, failed = false;
  for (const name of names) {
    const im = new Image();
    im.onload = () => { if (--left === 0 && !failed) spritesReady(); };
    im.onerror = () => { failed = true; };
    im.src = 'assets/sprites/' + SPR.meta[name].file;
    SPR.img[name] = im;
  }
})();

// A sprite lit by the current time of day: multiplied by the ambient colour, alpha kept.
function litSprite(name) {
  const im = SPR.img[name];
  if (ambKey === '1,1,1') return im;
  let t = SPR.lit.get(name);
  if (!t) {
    t = { canvas: document.createElement('canvas'), key: '' };
    t.canvas.width = im.naturalWidth; t.canvas.height = im.naturalHeight;
    SPR.lit.set(name, t);
  }
  if (t.key !== ambKey) {
    const g = t.canvas.getContext('2d');
    g.globalCompositeOperation = 'copy'; g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = css([amb[0] * 255, amb[1] * 255, amb[2] * 255]);
    g.fillRect(0, 0, t.canvas.width, t.canvas.height);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(im, 0, 0);
    t.key = ambKey;
  }
  return t.canvas;
}

// Draw a sprite with its anchor at (x, y).  o: { scale, rot, alpha, glow } — glow skips the
// time-of-day tint, for things that shine by themselves.
function sprite(name, x, y, o = {}) {
  const m = SPR.meta[name], k = o.scale || 1;
  const im = o.glow ? SPR.img[name] : litSprite(name);
  if (o.rot || o.alpha !== undefined) {
    ctx.save(); ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    ctx.drawImage(im, -m.ax * k, -m.ay * k, m.w * k, m.h * k);
    ctx.restore();
  } else ctx.drawImage(im, x - m.ax * k, y - m.ay * k, m.w * k, m.h * k);
}

// ── drawing: primitives ────────────────────────────────────────────────────
function poly(pts, fill, stroke) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function circle(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
}
function oval(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = fill; ctx.fill();
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);         ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function text(s, x, y, size, color, o = {}) {
  ctx.font = `${o.weight || 'bold'} ${size}px ${FONT}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'alphabetic';
  if (o.outline) {
    ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || Math.max(2.5, size * 0.2);
    ctx.strokeStyle = o.outline; ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function heartPath(cx, cy, s) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.9);
  ctx.bezierCurveTo(cx - s * 1.5, cy - s * 0.2, cx - s * 0.8, cy - s * 1.2, cx, cy - s * 0.4);
  ctx.bezierCurveTo(cx + s * 0.8, cy - s * 1.2, cx + s * 1.5, cy - s * 0.2, cx, cy + s * 0.9);
  ctx.closePath();
}

// ── drawing: scenery ───────────────────────────────────────────────────────
function drawSky(env) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, css(env.top)); g.addColorStop(1, css(env.bot));
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  if (env.stars > 0.02) {
    ctx.fillStyle = '#fff';
    for (const s of STARS) {
      ctx.globalAlpha = env.stars * (0.55 + 0.45 * Math.sin(clock * 0.05 + s.p));
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = env.stars;                          // the moon rises with the stars
    glow(268, 70, 70, '220,230,255', 0.35);
    circle(268, 70, 21, '#f3f0df');
    circle(261, 64, 4.5, '#dcd8c4'); circle(274, 76, 3.2, '#dcd8c4'); circle(271, 60, 2.2, '#dcd8c4');
    ctx.globalAlpha = 1;
  }

  const [sx, sy] = env.sun;
  if (sy < GROUND + 70) {
    const low = clamp((sy - 150) / 190, 0, 1);            // the sun reddens near the horizon
    const col = mix3([255, 250, 220], [255, 150, 80], low);
    glow(sx, sy, 150 + low * 60, `${col[0] | 0},${col[1] | 0},${col[2] | 0}`, 0.5);
    circle(sx, sy, 27, css(mix3([255, 253, 235], [255, 190, 110], low)));
  }
}

function ridgeNoise(x, seed) {
  return Math.sin(x * 0.011 + seed) * 0.5 + Math.sin(x * 0.023 + seed * 2.3) * 0.3
       + Math.sin(x * 0.047 + seed * 4.1) * 0.2;
}
function drawRidge(offset, base, amp, seed, fill, sharp) {
  ctx.beginPath(); ctx.moveTo(-20, H + 20);
  for (let x = -20; x <= W + 20; x += 8) {
    const n = ridgeNoise(x + offset, seed);
    ctx.lineTo(x, base - amp * (sharp ? 1 - Math.abs(n) * 1.25 : 0.5 + 0.5 * n));
  }
  ctx.lineTo(W + 20, H + 20); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}

const CLOUD_PUFFS = [[-34, 8, 20], [-12, -6, 27], [16, -2, 24], [40, 9, 17], [4, 12, 24]];
function puffs(list, x, y, s, dy) {
  ctx.beginPath();
  for (const [px, py, r] of list) { ctx.moveTo(x + px * s + r * s, y + py * s + dy); ctx.arc(x + px * s, y + py * s + dy, r * s, 0, TAU); }
  ctx.fill();
}
function drawCloud(c) {
  if (SPR.on) return sprite('cloud_' + c.v, c.x, c.y, { scale: c.s, alpha: 0.55 + 0.45 * c.d });
  ctx.globalAlpha = 0.5 + 0.45 * c.d;
  ctx.fillStyle = C('#c3d2e6'); puffs(CLOUD_PUFFS, c.x, c.y, c.s, 5 * c.s);
  ctx.fillStyle = C('#ffffff'); puffs(CLOUD_PUFFS, c.x, c.y, c.s, 0);
  ctx.globalAlpha = 1;
}

function drawDecor(env) {
  const cell = 90, first = Math.floor(worldX / cell) - 1;
  for (let i = first; i < first + 12; i++) {
    const h = hash(i), x = i * cell - worldX + hash(i + 0.5) * 50, y = GROUND + 3;
    const s = 0.8 + hash(i + 0.25) * 0.55;
    if (SPR.on) {
      const kind = h < 0.32 ? 'tree' : h < 0.47 ? 'pine' : h < 0.57 ? 'bush' : h < 0.63 ? 'house' : h < 0.68 ? 'hay' : '';
      if (kind) sprite(kind, x, y, { scale: kind === 'tree' || kind === 'pine' ? s : 1 });
      if (kind === 'house' && env.stars > 0.3)             // windows light up at dusk
        sprite('house_glow', x, y, { glow: true, alpha: clamp((env.stars - 0.3) * 3, 0, 1) });
      continue;
    }
    if (h < 0.32) {                                       // leafy tree
      ctx.fillStyle = C('#7a5230'); ctx.fillRect(x - 2 * s, y - 14 * s, 4 * s, 14 * s);
      circle(x, y - 24 * s, 14 * s, C('#3c9648'));
      circle(x - 4 * s, y - 28 * s, 9 * s, C('#59b962'));
    } else if (h < 0.47) {                                // pine
      ctx.fillStyle = C('#6b4628'); ctx.fillRect(x - 1.5 * s, y - 8 * s, 3 * s, 8 * s);
      for (let k = 0; k < 3; k++)
        poly([[x - (13 - k * 3) * s, y - (6 + k * 10) * s], [x + (13 - k * 3) * s, y - (6 + k * 10) * s],
              [x, y - (24 + k * 10) * s]], C(k ? '#2f8455' : '#27724a'));
    } else if (h < 0.57) {                                // bushes
      circle(x, y - 5, 8, C('#4aa651')); circle(x + 10, y - 4, 6, C('#3c9648'));
    } else if (h < 0.63) {                                // farmhouse (windows glow after dark)
      ctx.fillStyle = C('#f1e3c8'); ctx.fillRect(x - 14, y - 17, 28, 17);
      poly([[x - 18, y - 17], [x + 18, y - 17], [x, y - 31]], C('#c0503a'));
      ctx.fillStyle = C('#7a4a2a'); ctx.fillRect(x - 3, y - 10, 6, 10);
      ctx.fillStyle = env.stars > 0.4 ? '#ffd86b' : C('#9fd0ee');
      ctx.fillRect(x - 11, y - 13, 5, 5); ctx.fillRect(x + 6, y - 13, 5, 5);
    } else if (h < 0.68) {                                // hay bale
      oval(x, y - 6, 10, 7, C('#e6c75c'));
      ctx.strokeStyle = C('#c4a23c'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x, y - 6, 5, 3.5, 0, 0, TAU); ctx.stroke();
    }
  }
}

function drawScenery(env) {
  const haze = (hex, k) => css(mix3(tint3(hexRgb(hex)), env.bot, k));
  for (const c of clouds) if (c.d < 0.4) drawCloud(c);
  drawRidge(worldX * 0.06, GROUND - 6, 165, 1, haze('#6a7fae', 0.5), true);
  drawRidge(worldX * 0.12, GROUND,     112, 5, haze('#506e96', 0.28), true);
  for (const c of clouds) if (c.d >= 0.4) drawCloud(c);
  drawRidge(worldX * 0.25, GROUND + 6, 64, 9, haze('#5a9a66', 0.14), false);
  drawRidge(worldX * 0.45, GROUND + 6, 36, 13, C('#4a9150'), false);

  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, C('#8bd672')); g.addColorStop(1, C('#3f8f3d'));
  ctx.fillStyle = g; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = C('#4f9f49'); ctx.globalAlpha = 0.32;   // mowing stripes show the ground speed
  const sw = 80;
  for (let x = -(worldX % (sw * 2)) - sw; x < W + sw * 2; x += sw * 2)
    poly([[x, GROUND], [x + sw, GROUND], [x + sw - 26, H + 20], [x - 26, H + 20]], ctx.fillStyle);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C('#b9ee9c'); ctx.fillRect(-20, GROUND, W + 40, 2);
  drawDecor(env);
}

// ── drawing: the An-225 ────────────────────────────────────────────────────
function nacelle(cx, cy, s, far) {
  const L = 13 * s, R = 5.5 * s;
  const g = ctx.createLinearGradient(0, cy - R, 0, cy + R);
  g.addColorStop(0, C(far ? '#7c8591' : '#a3acb7')); g.addColorStop(1, C(far ? '#3a4149' : '#49515b'));
  poly([[cx - L + 3, cy - R * 0.7], [cx - L - 5 * s, cy - R * 0.38], [cx - L - 5 * s, cy + R * 0.38],
        [cx - L + 3, cy + R * 0.7]], C('#2a2f36'));       // exhaust nozzle
  rr(cx - L, cy - R, L * 2, R * 2, R); ctx.fillStyle = g; ctx.fill();
  oval(cx + L - 1.6 * s, cy, 2.7 * s, R, C('#dfe5ec'));   // polished intake lip
  oval(cx + L - 0.9 * s, cy, 1.8 * s, R * 0.76, C('#14171b'));
}

function fin(tx, ty, fill, line, flag) {
  const pts = [[tx + 10, ty + 5], [tx - 9, ty + 5], [tx - 20, ty - 27], [tx - 8, ty - 27]];
  poly(pts, fill, line);
  if (flag) {                                             // Ukrainian flag on the near fin
    ctx.save(); poly(pts); ctx.clip();
    ctx.fillStyle = C('#0057B7'); ctx.fillRect(tx - 24, ty - 21, 40, 6);
    ctx.fillStyle = C('#FFD700'); ctx.fillRect(tx - 24, ty - 15, 40, 6);
    ctx.restore();
  }
}

function fuselagePath() {
  ctx.beginPath();
  ctx.moveTo(104, 3);
  ctx.bezierCurveTo(100, -6, 88, -13, 70, -15);
  ctx.lineTo(-30, -15);
  ctx.bezierCurveTo(-60, -15, -90, -12, -108, -9);
  ctx.lineTo(-110, -3);
  ctx.bezierCurveTo(-90, 2, -60, 12, -30, 14);
  ctx.lineTo(70, 14);
  ctx.bezierCurveTo(88, 14, 100, 10, 104, 3);
  ctx.closePath();
}

function wheel(x, y, r) {
  circle(x, y, r, C('#1b1d21')); circle(x, y, r * 0.42, C('#8a9199'));
}

function planeLights() {
  const L = GEOM.lights;
  if (clock % 64 < 7) glow(L.wing[0], L.wing[1], 9, '255,60,60', 0.95);
  if (clock % 90 < 5) glow(L.tail[0], L.tail[1], 11, '255,255,255', 0.95);
  if ((clock + 30) % 64 < 7) glow(L.top[0], L.top[1], 8, '255,70,70', 0.9);
}

// susp is how far the body has sunk onto its landing gear; the wheels stay where they are.
function drawPlane(x, y, pitch, gear, alpha, susp) {
  if (!SPR.on) return drawPlaneVector(x, y + susp, pitch, gear, alpha, susp);
  ctx.save();
  ctx.translate(x, y + susp); ctx.rotate(pitch); ctx.globalAlpha = alpha;
  if (gear > 0.02)                                        // the gear slides up into the belly
    sprite('plane_gear', 0, -(1 - gear) * GEAR_TRAVEL * PLANE_SCALE - susp, { scale: PLANE_SCALE });
  sprite('plane_body', 0, 0, { scale: PLANE_SCALE });
  planeLights();
  ctx.restore();
}

function drawPlaneVector(x, y, pitch, gear, alpha, susp) {
  const line = C('#77818c');
  ctx.save();
  ctx.translate(x, y); ctx.rotate(pitch);
  ctx.globalAlpha = alpha; ctx.lineJoin = 'round'; ctx.lineWidth = 1.1;

  // far side: tailplane, fin, wing and its three engines
  poly([[-84, -10], [-100, -10], [-113, -24], [-103, -24]], C('#a3adb8'), line);
  fin(-107, -24, C('#aeb7c2'), line, false);
  poly(FAR_WING, C('#aab4bf'), line);
  for (const [ex, ey] of FAR_ENG) nacelle(ex, ey, 0.82, true);

  // landing gear swings down as the ground gets close
  if (gear > 0.02) {
    const wy = 19.5 + 14 * gear - susp;
    ctx.strokeStyle = C('#5d646c'); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(74, 12); ctx.lineTo(74, wy);
    for (const sx of [-25, -5, 15]) { ctx.moveTo(sx, 14); ctx.lineTo(sx, wy); }
    ctx.moveTo(-31, wy); ctx.lineTo(21, wy);
    ctx.stroke();
    wheel(71, wy, 3.6); wheel(77.5, wy, 3.6);
    for (let wx = -30; wx <= 20; wx += 10) wheel(wx, wy, 4.2);
    ctx.lineWidth = 1.1;
  }

  // gear pod under the belly
  ctx.beginPath(); ctx.moveTo(48, 12); ctx.bezierCurveTo(40, 23, -40, 23, -50, 12); ctx.closePath();
  ctx.fillStyle = C('#a9b3be'); ctx.fill(); ctx.strokeStyle = line; ctx.stroke();

  // fuselage with shading, cheat line and nose-door seam
  const body = ctx.createLinearGradient(0, -15, 0, 16);
  body.addColorStop(0, C('#ffffff')); body.addColorStop(0.5, C('#f0f3f6')); body.addColorStop(1, C('#a9b3be'));
  fuselagePath(); ctx.fillStyle = body; ctx.fill();
  ctx.save(); fuselagePath(); ctx.clip();
  ctx.fillStyle = C('#0057B7'); ctx.fillRect(-112, -2.5, 220, 3.2);
  ctx.fillStyle = C('#FFD700'); ctx.fillRect(-112, 0.7, 220, 3.2);
  ctx.strokeStyle = C('#aab3bd'); ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(63, -16); ctx.lineTo(61, 15); ctx.stroke();
  ctx.restore();
  ctx.lineWidth = 1.1; fuselagePath(); ctx.strokeStyle = line; ctx.stroke();

  poly([[70, -12.5], [86, -9.6], [93, -5.6], [90, -4.2], [72, -6.2]], C('#1f3650'));   // flight deck glass
  ctx.strokeStyle = C('#8fc4ee'); ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(73, -11); ctx.lineTo(84, -9); ctx.stroke();
  ctx.lineWidth = 1.1;
  text('AN-225', 51, -5.2, 6.5, C('#003366'), { align: 'center' });

  // near side: tailplane, fin, wing and its three engines
  poly([[-82, -5], [-100, -4], [-117, 9], [-105, 9]], C('#cfd7df'), line);
  fin(-110, 9, C('#e3e8ed'), line, true);
  const wing = ctx.createLinearGradient(24, -9, -44, 30);
  wing.addColorStop(0, C('#eef2f6')); wing.addColorStop(1, C('#bcc6d0'));
  poly(NEAR_WING, wing, line);
  ctx.strokeStyle = C('#9aa4af'); ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-1, -9); ctx.lineTo(-46, 30); ctx.stroke();               // flap line
  for (const [ex, ey] of NEAR_ENG) nacelle(ex, ey, 1, false);

  planeLights();
  ctx.restore();
}

function drawPlaneExtras() {
  const alt = clamp((floorY() - plane.y) / 330, 0, 1);
  ctx.globalAlpha = 0.3 * (1 - alt * 0.85);               // shadow shrinks and fades with altitude
  oval(PLANE_X - 6, RUNWAY_Y + 3, 100 * (1 - alt * 0.5), 7 * (1 - alt * 0.5), '#0b2010');
  ctx.globalAlpha = 1;
}

function drawAura() {
  if (plane.magnet > 0) {
    const k = (clock % 40) / 40;
    ctx.strokeStyle = '#c79bff'; ctx.lineWidth = 2;
    ctx.globalAlpha = (1 - k) * (plane.magnet < 90 ? 0.4 : 0.7);
    ctx.beginPath(); ctx.ellipse(PLANE_X, plane.y, 190 - 150 * k, 110 - 86 * k, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (plane.shield > 0 && (plane.shield > 90 || clock % 12 < 7)) {
    const pulse = 1 + 0.03 * Math.sin(clock * 0.15);
    ctx.save(); ctx.translate(PLANE_X - 4, plane.y - 4); ctx.rotate(plane.pitch); ctx.scale(pulse, pulse);
    const g = ctx.createRadialGradient(0, 0, 40, 0, 0, 132);
    g.addColorStop(0, 'rgba(120,200,255,0)'); g.addColorStop(1, 'rgba(120,200,255,0.3)');
    ctx.scale(1, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, 132, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(190,235,255,0.9)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }
}

// ── drawing: "catch this" and "dodge this" markers ─────────────────────────
// Everything worth catching floats inside a pulsing green ring with twinkles on it; everything
// dangerous has a red haze behind it and a red warning sign above it.
const GOOD = { crate: [-9, 33], heart: [0, 24], shield: [0, 24], magnet: [0, 24] };      // ring: dy, radius
const DANGER = {                                                   // haze: dy, radius; sign: dy, size
  bird: [0, 27, -18, 0.8], balloon: [-6, 54, -52, 1], storm: [0, 80, -42, 1.1], jet: [0, 46, -24, 1],
};

function twinkle(x, y, r) {
  const q = r * 0.28;
  poly([[x, y - r], [x + q, y - q], [x + r, y], [x + q, y + q], [x, y + r], [x - q, y + q], [x - r, y], [x - q, y - q]],
       '#ffffff');
}

function drawGoodRing(p) {
  const [dy, r0] = GOOD[p.kind];
  const k = 0.5 + 0.5 * Math.sin(clock * 0.14 + p.phase), r = r0 + k * 2.5, y = p.y + dy;
  glow(p.x, y, r + 18, '80,255,140', 0.3 + 0.2 * k);
  for (const [lw, col] of [[6.5, 'rgba(6,56,24,0.6)'], [3.2, '#6dff9a']]) {
    ctx.lineWidth = lw; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(p.x, y, r, 0, TAU); ctx.stroke();
  }
  for (let i = 0; i < 3; i++) {
    const a = clock * 0.045 + p.phase + i * TAU / 3;
    twinkle(p.x + Math.cos(a) * r, y + Math.sin(a) * r, 4.2 + 1.3 * Math.sin(clock * 0.2 + i * 2));
  }
  if (p.tip) text('CATCH!', p.x, y - r - 9, 14, '#8dffb0', { align: 'center', outline: 'rgba(4,40,18,0.9)' });
}

const offScreen = o => o.kind === 'jet' && o.x > W + 14;   // a jet that is still only a warning arrow

function drawDangerHaze(o) {
  if (o.scared || offScreen(o)) return;
  const [dy, r] = DANGER[o.kind];
  glow(o.x, o.y + dy, r, '255,40,40', 0.46 + 0.1 * Math.sin(clock * 0.2 + o.phase));
}

function drawDangerSign(o) {
  if (o.scared || offScreen(o)) return;
  const [, , dy, k] = DANGER[o.kind];
  const x = o.x, y = o.y + dy + Math.sin(clock * 0.18 + o.phase) * 1.5;
  ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
  poly([[x, y - 15 * k], [x + 9.5 * k, y + k], [x - 9.5 * k, y + k]], '#ff2d2d', '#ffffff');
  text('!', x, y - 1.8 * k, 11.5 * k, '#ffffff', { align: 'center' });
  if (!o.tip) return;
  const ink = { align: 'center', outline: 'rgba(70,0,0,0.9)' };
  if (o.kind === 'bird') text('DODGE!', x - 12, y - 2, 14, '#ff9a9a', { ...ink, align: 'right' });   // clear of the flock
  else text('DODGE!', x, y - 15 * k - 6, 14, '#ff9a9a', ink);
}

// ── drawing: obstacles & pickups ───────────────────────────────────────────
function drawBird(o) {
  if (SPR.on)
    return sprite('bird_' + [0, 1, 2, 1][Math.floor((clock + o.phase * 3) / 5) % 4], o.x, o.y, { rot: o.scared ? 0.5 : 0 });
  const flap = Math.sin(clock * 0.32 + o.phase);
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.scared) ctx.rotate(0.5);
  poly([[-3, -2], [5, -3 - 11 * flap], [12, -2 - 9 * flap], [5, 1]], C('#2c3038'));     // far wing
  oval(0, 0, 10, 5.5, C('#454b57'));
  oval(-1, 2, 6.5, 2.7, C('#9aa2b0'));
  circle(-9, -3, 4.6, C('#454b57'));
  poly([[-13, -4.2], [-19.5, -2.4], [-13, -1]], C('#f2a23a'));
  circle(-10.6, -4, 1.4, '#fff'); circle(-11, -4, 0.7, '#111');
  poly([[8, -1], [17, -4], [16, 2.5], [8, 2]], C('#2c3038'));
  ctx.beginPath();                                                                       // near wing
  ctx.moveTo(-4, -2); ctx.quadraticCurveTo(2, -4 - 16 * flap, 13, -3 - 13 * flap);
  ctx.quadraticCurveTo(8, -1 - 3 * flap, 5, 1); ctx.closePath();
  ctx.fillStyle = C('#5d6573'); ctx.fill();
  ctx.restore();
}

const BALLOON_COLS = [['#e84a5f', '#ffd166'], ['#2a9d8f', '#f4f1de'], ['#7b5cd6', '#ffb4a2']];
function balloonPath() {
  ctx.beginPath(); ctx.moveTo(0, -34);
  ctx.bezierCurveTo(27, -34, 27, -3, 7, 12); ctx.lineTo(-7, 12);
  ctx.bezierCurveTo(-27, -3, -27, -34, 0, -34); ctx.closePath();
}
function drawBalloon(o) {
  if (SPR.on) return sprite('balloon_' + o.col, o.x, o.y, { rot: Math.sin(o.t * 0.03 + o.phase) * 0.05 });
  const cols = BALLOON_COLS[o.col];
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(Math.sin(o.t * 0.03 + o.phase) * 0.05);
  ctx.scale(1.25, 1.25);
  ctx.strokeStyle = C('#5a4632'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(-5, 22); ctx.moveTo(6, 12); ctx.lineTo(5, 22); ctx.stroke();
  ctx.save(); balloonPath(); ctx.clip();
  for (let i = 0; i < 6; i++) { ctx.fillStyle = C(cols[i % 2]); ctx.fillRect(-27 + i * 9, -36, 9.5, 50); }
  const g = ctx.createRadialGradient(-9, -22, 2, 0, -12, 34);
  g.addColorStop(0, 'rgba(255,255,255,0.45)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(0,0,30,0.3)');
  ctx.fillStyle = g; ctx.fillRect(-28, -36, 56, 50);
  ctx.restore();
  rr(-6.5, 22, 13, 9, 2); ctx.fillStyle = C('#8a5a2b'); ctx.fill();
  ctx.strokeStyle = C('#5f3c18'); ctx.beginPath(); ctx.moveTo(-6.5, 26.5); ctx.lineTo(6.5, 26.5); ctx.stroke();
  ctx.restore();
}

const STORM_PUFFS = [[-40, 6, 20], [-18, -8, 27], [12, -10, 29], [40, 4, 21], [0, 10, 26], [-22, 12, 20], [24, 12, 20]];
function drawStorm(o) {
  const strike = stormStriking(o), charging = stormCharging(o);
  const fall = GROUND - o.y - 18;
  ctx.strokeStyle = C('#bcd6f2'); ctx.lineWidth = 1.2; ctx.globalAlpha = 0.42;          // rain
  ctx.beginPath();
  for (let i = 0; i < 18 && !o.icon; i++) {
    const ry = (clock * 7 + hash(i * 3.1 + o.seed) * 400) % fall;
    const rx = o.x - 52 + hash(i + o.seed) * 104 - ry * 0.12;
    ctx.moveTo(rx, o.y + 18 + ry); ctx.lineTo(rx - 1.2, o.y + 28 + ry);
  }
  ctx.stroke(); ctx.globalAlpha = 1;

  if (charging) {                                          // warning column before the bolt
    const g = ctx.createLinearGradient(0, o.y, 0, GROUND);
    g.addColorStop(0, 'rgba(255,235,120,0.38)'); g.addColorStop(1, 'rgba(255,235,120,0.06)');
    ctx.fillStyle = g; ctx.fillRect(o.x - 9, o.y + 14, 18, GROUND - o.y - 14);
  }
  const lit = strike || (charging && clock % 8 < 4);
  if (SPR.on) sprite(lit ? 'storm_lit' : 'storm', o.x, o.y, { glow: lit });
  else {
    ctx.fillStyle = C('#34384e'); puffs(STORM_PUFFS, o.x, o.y, 1, 6);
    ctx.fillStyle = strike ? '#e3e6ff' : C(lit ? '#8f95b8' : '#5f6584'); puffs(STORM_PUFFS, o.x, o.y, 1, 0);
  }

  if (strike) {
    const seed = Math.floor(clock / 3) + o.seed;
    const pts = [[o.x, o.y + (SPR.on ? 26 : 16)]];
    for (let y = o.y + 38, i = 1; y < GROUND; y += 22, i++) pts.push([o.x + (hash(seed + i * 7.7) - 0.5) * 26, y]);
    pts.push([o.x + (hash(seed) - 0.5) * 14, GROUND + 2]);
    ctx.lineJoin = 'miter'; ctx.lineCap = 'round';
    for (const [lw, col] of [[10, 'rgba(255,240,150,0.3)'], [3.4, '#fff7c2'], [1.3, '#ffffff']]) {
      ctx.lineWidth = lw; ctx.strokeStyle = col;
      ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    glow(pts[pts.length - 1][0], GROUND, 34, '255,245,180', 0.8);
  }
}

function drawJet(o) {
  if (o.x > W + 14) {                                     // warning marker before it arrives
    if (clock % 18 < 11) {
      poly([[W - 44, o.y], [W - 16, o.y - 16], [W - 16, o.y + 16]], '#ff4d4d', '#ffffff');
      text('!', W - 26, o.y + 6, 17, '#fff', { align: 'center' });
    }
    return;
  }
  if (SPR.on) {
    const e = SPR.meta.jet.points.exhaust;
    glow(o.x + e[0] + 4, o.y + e[1], 13, '255,170,60', 0.6 + 0.3 * Math.sin(clock * 0.9));
    return sprite('jet', o.x, o.y);
  }
  ctx.save(); ctx.translate(o.x, o.y);
  glow(34, 0, 12, '255,170,60', 0.6 + 0.3 * Math.sin(clock * 0.9));
  poly([[14, -4], [23, -5], [29, -17], [21, -17]], C('#a52f3a'));
  rr(-24, -6, 50, 12, 6); ctx.fillStyle = C('#dc4753'); ctx.fill();
  poly([[-22, -5.5], [-36, 0.5], [-22, 5.5]], C('#f3f5f7'));
  oval(-9, -4.5, 8, 3.4, C('#bfe6ff'));
  poly([[-4, 2], [11, 2], [20, 13], [9, 13]], C('#a52f3a'));
  ctx.fillStyle = C('#f3f5f7'); ctx.fillRect(-6, 0.5, 26, 1.6);
  ctx.restore();
}

function drawCrate(p) {
  if (SPR.on) return sprite('crate', p.x, p.y, { rot: Math.sin(p.t * 0.05 + p.phase) * 0.12 });
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.rotate(Math.sin(p.t * 0.05 + p.phase) * 0.12);
  ctx.strokeStyle = C('#f5f5f5'); ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (const [cx, bx] of [[-19, -9], [-7, -4], [7, 4], [19, 9]]) { ctx.moveTo(cx, -25); ctx.lineTo(bx, -9); }
  ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -25, 21, 15, 0, Math.PI, TAU); ctx.closePath();        // plain white canopy
  ctx.fillStyle = C('#ffffff'); ctx.fill();
  ctx.strokeStyle = C('#c9d3df'); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = C('#b9772f'); ctx.fillRect(-11, -9, 22, 20);                           // wooden crate
  ctx.strokeStyle = C('#74461a'); ctx.lineWidth = 1.6; ctx.strokeRect(-11, -9, 22, 20);
  ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-11, -9); ctx.lineTo(11, 11); ctx.moveTo(11, -9); ctx.lineTo(-11, 11); ctx.stroke();
  ctx.fillStyle = C('#ffd54a'); ctx.fillRect(-11, -1.5, 22, 5);
  ctx.restore();
}

const POWER_COL = { heart: '#ff5d73', shield: '#39a9f5', magnet: '#a56bff' };
function drawPower(p) {
  const col = POWER_COL[p.kind];
  const s = 1 + 0.08 * Math.sin(clock * 0.12 + p.phase);
  if (SPR.on) return sprite('power_' + p.kind, p.x, p.y, { scale: s, glow: true });
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s);
  const g = ctx.createRadialGradient(-4, -5, 1, 0, 0, 14);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, col); g.addColorStop(1, col);
  circle(0, 0, 14, g);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineCap = 'butt';
  if (p.kind === 'heart') { heartPath(0, 0.5, 6.2); ctx.fill(); }
  else if (p.kind === 'shield') {
    ctx.beginPath(); ctx.moveTo(0, -7.5); ctx.lineTo(6.5, -5); ctx.lineTo(6.5, 0.5);
    ctx.quadraticCurveTo(5.5, 6, 0, 8.5); ctx.quadraticCurveTo(-5.5, 6, -6.5, 0.5); ctx.lineTo(-6.5, -5);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.lineWidth = 3.6;
    ctx.beginPath(); ctx.moveTo(-5, -6.5); ctx.lineTo(-5, 1); ctx.arc(0, 1, 5, Math.PI, 0, true); ctx.lineTo(5, -6.5);
    ctx.stroke();
    ctx.fillStyle = '#ffd6dc'; ctx.fillRect(-6.8, -8, 3.6, 3); ctx.fillRect(3.2, -8, 3.6, 3);
  }
  ctx.restore();
}

function drawParticles(front) {
  for (const p of particles) {
    if (!!p.front !== front) continue;
    const k = p.life / p.max;
    ctx.globalAlpha = (p.a || 1) * k;
    ctx.fillStyle = p.tint ? C(p.col) : p.col;
    if (p.feather) {
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.8, p.r * 0.6, p.rot, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.glow ? p.r * (0.4 + k) : p.r, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ── drawing: HUD & screens ─────────────────────────────────────────────────
function panel(x, y, w, h, r, fill, stroke) {
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.stroke(); }
}

function drawHUD() {
  panel(10, 10, 168, 62, 10, 'rgba(6,20,48,0.5)');
  for (let i = 0; i < MAX_HP; i++) {
    heartPath(28 + i * 24, 27, 8);
    ctx.fillStyle = i < hp ? '#ff5d73' : 'rgba(255,255,255,0.18)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4; ctx.stroke();
  }
  text(String(score), 20, 62, 22, '#ffffff');
  if (combo > 1) {
    panel(118, 44, 50, 22, 11, '#FFD700');
    text('x' + combo, 143, 61, 15, '#3a2a00', { align: 'center' });
  }

  panel(W - 140, 10, 130, 62, 10, 'rgba(6,20,48,0.5)');
  text('Level ' + level, W - 20, 31, 16, '#FFD700', { align: 'right' });
  text((dist / 2000).toFixed(1) + ' km', W - 20, 48, 12, '#d6e6ff', { align: 'right', weight: 'normal' });
  text('Best ' + Math.max(best, score), W - 20, 64, 12, '#9fc4ff', { align: 'right', weight: 'normal' });

  let y = 80;                                             // active power-up timers
  for (const [kind, left, label] of [['shield', plane.shield, 'Shield'], ['magnet', plane.magnet, 'Magnet']]) {
    if (left <= 0) continue;
    panel(10, y, 118, 18, 9, 'rgba(6,20,48,0.5)');
    rr(12, y + 2, 114 * left / 480, 14, 7); ctx.fillStyle = POWER_COL[kind]; ctx.fill();
    text(label, 20, y + 13.5, 11, '#fff');
    y += 23;
  }

  if (banner) {
    const a = clamp(Math.min(banner.t / 25, (150 - banner.t) / 15), 0, 1);
    ctx.globalAlpha = a;
    text(banner.title, W / 2, 106 - (1 - a) * 10, 34, '#FFD700', { align: 'center', outline: 'rgba(0,20,60,0.85)' });
    text(banner.sub, W / 2, 131 - (1 - a) * 10, 16, '#ffffff', { align: 'center', outline: 'rgba(0,20,60,0.85)' });
    ctx.globalAlpha = 1;
  }
}

// One of everything, drawn exactly as it looks in flight, sorted into "catch" and "dodge".
const LEGEND_GOOD = [['crate', 152, 'crates'], ['heart', 216, 'repairs'], ['shield', 266, 'shields'], ['magnet', 316, 'magnets']];
const LEGEND_BAD = [['bird', 388, 'birds'], ['balloon', 450, 'balloons'], ['storm', 550, 'storms'], ['jet', 652, 'jets']];

function legendBox(x, w, title, fill, line, ink) {
  panel(x, 122, w, 146, 10, fill, line);
  rr(x + w / 2 - 62, 111, 124, 22, 11); ctx.fillStyle = line; ctx.fill();
  text(title, x + w / 2, 127, 13, ink, { align: 'center' });
}

function drawLegend() {
  legendBox(108, 242, 'CATCH THESE', 'rgba(60,220,120,0.12)', '#6dff9a', '#06361a');
  legendBox(358, 334, 'DODGE THESE', 'rgba(255,70,70,0.12)', '#ff7b7b', '#4a0606');
  for (const [kind, x, label] of LEGEND_GOOD) {
    const p = { kind, x, y: kind === 'crate' ? 213 : 204, t: 0, phase: x };
    drawGoodRing(p);
    (kind === 'crate' ? drawCrate : drawPower)(p);
    text(label, x, 258, 11.5, '#d9ffe6', { align: 'center', weight: 'normal' });
  }
  for (const [kind, x, label] of LEGEND_BAD) {
    const o = { kind, x, y: kind === 'bird' || kind === 'jet' ? 212 : 204, t: 0, phase: 0, col: 0, seed: 1, icon: true };
    drawDangerHaze(o);
    ({ bird: drawBird, balloon: drawBalloon, storm: drawStorm, jet: drawJet })[kind](o);
    drawDangerSign(o);
    text(label, x, 258, 11.5, '#ffe0e0', { align: 'center', weight: 'normal' });
  }
}

function drawStartScreen() {
  panel(W / 2 - 300, 12, 600, 290, 16, 'rgba(4,22,62,0.86)', '#FFD700');
  text("Lewis's An-225 Adventure!", W / 2, 52, 30, '#FFD700', { align: 'center', outline: '#04163e' });
  text('Hold SPACE or ↑ (or hold the screen) to take off and climb   •   ↓ to dive', W / 2, 76, 13.5, '#aadaff',
       { align: 'center', weight: 'normal' });
  text('Catch crates in a row for a combo up to x5   •   Land softly or lose a heart!', W / 2, 96, 13.5, '#FFD700',
       { align: 'center', weight: 'normal' });
  drawLegend();
  ctx.globalAlpha = 0.65 + 0.35 * Math.sin(clock * 0.09);
  text('Press SPACE or tap to take off!', W / 2, 290, 16, '#ffffff', { align: 'center' });
  ctx.globalAlpha = 1;
  if (best > 0) text('Best: ' + best, W / 2, 322, 14, '#ffffff', { align: 'center', outline: 'rgba(0,20,60,0.8)' });
}

function drawGameOver() {
  const a = clamp(overT / 20, 0, 1), cx = W / 2, cy = H / 2 - 16;
  ctx.globalAlpha = a;
  panel(cx - 235, cy - 112, 470, 224, 16, 'rgba(4,22,62,0.9)', '#FFD700');
  text('The An-225 needs a rest!', cx, cy - 72, 23, '#FFD700', { align: 'center' });
  text(String(score), cx, cy - 26, 40, '#ffffff', { align: 'center' });
  text(newBest ? '★ New best score! ★' : 'Best: ' + best, cx, cy + 2, 16, newBest ? '#ffe27a' : '#aadaff',
       { align: 'center' });
  text(`Level ${level}   •   ${(dist / 2000).toFixed(1)} km flown   •   ${crates} crate${crates === 1 ? '' : 's'}`,
       cx, cy + 34, 14, '#d6e6ff', { align: 'center', weight: 'normal' });
  if (overT > 45) {
    ctx.globalAlpha = a * (0.65 + 0.35 * Math.sin(clock * 0.09));
    text('Press R or SPACE to fly again!', cx, cy + 68, 16, '#ffffff', { align: 'center' });
  }
  ctx.globalAlpha = a;
  text('Amazing flying, Lewis!', cx, cy + 96, 14, '#FFD700', { align: 'center', weight: 'italic' });
  ctx.globalAlpha = 1;
}

function drawPaused() {
  ctx.fillStyle = 'rgba(4,14,40,0.55)'; ctx.fillRect(0, 0, W, H);
  text('Paused', W / 2, H / 2 - 6, 40, '#FFD700', { align: 'center', outline: '#04163e' });
  text('Press P or SPACE to keep flying', W / 2, H / 2 + 24, 15, '#ffffff', { align: 'center', weight: 'normal' });
}

// ── frame ──────────────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  const env = environment();
  setAmbient(env.amb);

  ctx.save();
  if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawSky(env);
  drawScenery(env);
  drawPlaneExtras();
  for (const o of obstacles) drawDangerHaze(o);
  for (const o of obstacles) if (o.kind === 'storm') drawStorm(o);
  for (const p of pickups) { drawGoodRing(p); (p.kind === 'crate' ? drawCrate : drawPower)(p); }
  for (const o of obstacles) {
    if (o.kind === 'bird') drawBird(o);
    else if (o.kind === 'balloon') drawBalloon(o);
    else if (o.kind === 'jet') drawJet(o);
  }
  for (const o of obstacles) drawDangerSign(o);
  drawParticles(false);
  const blink = plane.invuln > 0 && state === 'playing' && clock % 10 < 5;
  drawPlane(PLANE_X, plane.y, plane.pitch, plane.gear, blink ? 0.4 : 1, plane.susp);
  drawAura();
  drawParticles(true);
  ctx.restore();

  if (flash > 0.02) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.life / 20, 0, 1);
    text(p.text, p.x, p.y, p.size, p.col, { align: 'center', outline: 'rgba(0,15,45,0.85)' });
  }
  ctx.globalAlpha = 1;

  if (state === 'start') drawStartScreen();
  else drawHUD();
  if (state === 'gameover') drawGameOver();
  if (state === 'paused') drawPaused();
}

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = clamp(Math.round(canvas.getBoundingClientRect().width * dpr), 400, 2400);
  canvas.width = w; canvas.height = Math.round(w * H / W);
  viewScale = w / W;
}

let lastTime = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(now - lastTime, 100);                   // never try to catch up more than 0.1 s
  lastTime = now;
  while (acc >= STEP) { tick(); acc -= STEP; }
  draw();
}

window.addEventListener('resize', fit);
initClouds();
fit();
requestAnimationFrame(t => { lastTime = t; frame(t); });
</script>
</body>
